[package]
name = "inchworm"
version = "0.1.0"
edition = "2024"
description = "local coding agent orchestrator"
license = "MIT OR Apache-2.0"
authors = ["Dominic Burkart"]
repository = "https://github.com/DominicBurkart/inchworm"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.18"
libc = "0.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
toml = "1.2.1"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
assert_cmd = "2.2.2"
predicates = "3.1.4"
proptest = "1.12.0"
tempfile = "3.27.0"

[dev-dependencies.cargo-husky]
version = "1"
default-features = false
features = ["user-hooks"]

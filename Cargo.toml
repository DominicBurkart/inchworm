[package]
name = "inchworm"
version = "0.1.0"
edition = "2024"
description = "local coding agent orchestrator"
license = "MIT OR Apache-2.0"
authors = ["Dominic Burkart"]
repository = "https://github.com/DominicBurkart/inchworm"

[dependencies]
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.2.1"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"

[dev-dependencies.cargo-husky]
version = "1"
default-features = false
features = ["user-hooks"]

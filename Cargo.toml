[package]
name = "inchworm"
version = "0.1.0"
edition = "2024"
description = "local coding agent orchestrator"
license = "MIT OR Apache-2.0"
authors = ["Dominic Burkart"]
repository = "https://github.com/DominicBurkart/inchworm"

[dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.21"
toml = "1.1.8"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3.27.0"
tiny_http = "0.12"
